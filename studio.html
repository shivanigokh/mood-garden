<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Studio · Mood Garden</title>
  <meta name="description" content="Play music with your hands in the air: a harmonium you squeeze, air drums and a theremin. Hand tracking runs on your device." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
  <link rel="stylesheet" href="studio.css?v=5" />
</head>
<body class="studio">
  <nav class="modes" aria-label="Experiences">
    <a href="./">Garden</a>
    <a href="feast.html">Feast</a>
    <a href="studio.html" aria-current="page">Studio</a>
  </nav>

  <video id="cam" class="studio-video" playsinline muted autoplay></video>
  <canvas id="stage" aria-label="Instrument"></canvas>

  <section id="landing" class="landing">
    <div class="landing-inner">
      <h1 class="title">STUDIO</h1>
      <p class="subtitle">Your hands are the instrument.</p>
      <button id="enter" class="enter">Open the studio</button>
      <p id="landing-note" class="landing-note">
        Squeeze a harmonium, drum on the air or play a theremin. Turn your sound on.
        Hand tracking runs on this device and nothing is recorded or uploaded.
      </p>
    </div>
  </section>

  <div id="hud" class="hud" hidden>
    <div class="picker" role="tablist" aria-label="Instrument">
      <button role="tab" data-inst="harmonium" aria-selected="true">Harmonium</button>
      <button role="tab" data-inst="drums" aria-selected="false">Air drums</button>
      <button role="tab" data-inst="theremin" aria-selected="false">Theremin</button>
    </div>

    <p id="hint" class="hint"></p>

    <div id="status" class="status" data-state="loading" role="status">
      <span class="dot"></span><span class="status-text">starting camera…</span>
    </div>

    <nav class="controls" aria-label="Studio controls">
      <button id="btn-skeleton" class="ctl" title="Hide hand outlines" aria-label="Show or hide hand outlines" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.3 1.3 0 0 1 2.6 0V11M10.6 11V5a1.3 1.3 0 0 1 2.6 0v6M13.2 11V6a1.3 1.3 0 0 1 2.6 0v7M15.8 13v-3a1.3 1.3 0 0 1 2.6 0v4.5c0 3.6-2.6 6-6 6-2.7 0-4.2-1.3-5.6-3.6L5 14a1.3 1.3 0 0 1 2.2-1.4L8 14"/></svg>
      </button>
    </nav>
  </div>

  <script type="module" src="js/studio.js?v=5"></script>
</body>
</html>
